<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>

<body>
    <table>
        <caption>Biodata</caption>
        <thead>
            <tr>
                <th>Serial no</th>
                <th>Name </th>
                <th>Surname </th>
                <th>Phone </th>
        </thead>
        </tr>
        <tr>
            <tbody>
                <td>1</td>
                <td>Ayush</td>
                <td>Yadav</td>
                <td>9098919293</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Akshat</td>
            <td>Kandwal</td>
            <td>8231372378</td>
            </tbody>
        </tr>
        <tfoot>
            <tr>
                <td>"this is summary and footer"</td>
            </tr>
        </tfoot>




        <tr>
            <th colspan="1">name</th>
            <th>surname</th>
        </tr>


        <tr>
            <th rowspan="3">April</th>
            <td>hello</td>
            <td>hi</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
        </tr>

            <td>3</td>
            <td>4</td>
        </tr>

        <table border="1" align="center" cellpadding="10" cellspacing="10">
            <tr>
                <th colspan="3">2022</th>
            </tr>
            <tr>
                <td>1</td>

            </tr>

                <td rowspan="2" colspan="2">FIESTA</td>

            </tr>

            </tr>

</body>

</html>
