<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
</head>

<body align="center">
    <fieldset>
    <h1>Hotel Room Booking Form</h1>
    <form action="text">

        <label for="text">Full Name:</label>
        <input type="text">
        <br>
        <br>

        <label for="text">Email:</label>
        <input type="email" name="email" id="email">
        <br>
        <br>

        <label for="text">Phone:</label>
        <input type="tell" name="tell" id="tell">
        <br>
        <br>

        <label for="text">Check-in Date:</label>
        <input type="date" name="dob" id="dob">
        <br>
        <br>

        <label for="text">Check-out Date:</label>
        <input type="date" name="dob" id="dob">
        <br>
        <br>

        <label for="Room">Room Type:</label>
        <select name="room" id="room">
        <option value="single room">single room</option>
        <option value="double room">double room</option>
        <option value="triple room">triple room</option>
        </select>
        <br>
        <br>

        <label for="Number">Number of Guests:</label>
        <input type="text" name="guests" id="guests">
        <br>
        <br>
        
        <label for="text">Special requests:</label>
        <br>
        <textarea name="text" id="text"></textarea>
        <br>
        <br>
        

        
        <button>Book Now</button>
        <button>Reset form</button>

    </form>
    </fieldset>
</body>

</html>
